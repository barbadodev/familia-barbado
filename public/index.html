<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Despensa Familiar 🛒 (Mercadona Oficial)</title>
  
  <!-- PWA & Iconos para Pantalla de Inicio en Móviles (iPhone y Android) -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="icon" type="image/png" href="/icon.png">
  <meta name="theme-color" content="#00875a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Despensa">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light pb-5">

  <!-- Navbar Superior -->
  <nav class="navbar navbar-dark bg-mercadona shadow-sm sticky-top py-2">
    <div class="container" style="max-width: 600px;">
      <div class="d-flex align-items-center gap-2">
        <span class="fs-3">🛒</span>
        <div>
          <h1 class="h6 mb-0 text-white fw-bold">Despensa Familiar</h1>
          <small class="text-white-50" style="font-size: 0.72rem;">Catálogo oficial tienda.mercadona.es</small>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <!-- Botón WhatsApp -->
        <button 
          onclick="shareOnWhatsApp()" 
          class="btn btn-sm btn-light text-success fw-bold rounded-pill px-2.5 shadow-sm"
          title="Compartir por WhatsApp"
        >
          <i class="bi bi-whatsapp"></i> <span class="d-none d-sm-inline">WhatsApp</span>
        </button>

        <!-- Selector de Perfil Familiar -->
        <select id="userSelector" class="form-select form-select-sm rounded-pill fw-bold bg-dark-subtle border-0 text-dark shadow-sm">
          <option value="Mamá 🌸">Mamá 🌸</option>
          <option value="Papá 🛠️">Papá 🛠️</option>
          <option value="Tete 🧢" selected>Tete 🧢</option>
          <option value="Tata 🎀">Tata 🎀</option>
          <option value="Familia 🏠">Familia 🏠</option>
        </select>
      </div>
    </div>
  </nav>

  <!-- Contenedor Principal -->
  <main class="container my-3" style="max-width: 600px;">

    <!-- Tarjeta de Resumen y Presupuesto Total Mercadona -->
    <div class="card border-0 shadow-sm rounded-4 text-white bg-gradient-mercadona mb-3 p-3">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
          <div class="bg-white bg-opacity-25 rounded-3 p-2 fs-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
            💶
          </div>
          <div>
            <small class="text-white-50 text-uppercase fw-bold" style="font-size: 0.68rem; letter-spacing: 0.5px;">Gasto estimado Mercadona</small>
            <div class="d-flex align-items-baseline gap-2">
              <span id="pendingCostDisplay" class="h3 mb-0 fw-bolder">0.00 €</span>
            </div>
          </div>
        </div>

        <span id="totalItemsBadge" class="badge bg-white text-dark rounded-pill px-3 py-2 fw-bold shadow-xs">
          0 pendientes
        </span>
      </div>
    </div>

    <!-- Tarjeta Formulario de Añadir Producto (100% Mercadona) -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-3">
      
      <div class="d-flex align-items-center justify-content-between mb-2">
        <label for="productInput" class="form-label mb-0 small fw-bold text-secondary text-uppercase d-flex align-items-center gap-1.5">
          <span>Buscar en Mercadona</span>
          <a href="https://tienda.mercadona.es/" target="_blank" class="badge bg-success-subtle text-success border border-success-subtle text-decoration-none" style="font-size: 0.68rem;">
            tienda.mercadona.es ↗
          </a>
        </label>

        <!-- Botón de Voz -->
        <button id="voiceBtn" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 d-flex align-items-center gap-1" title="Dictar por voz">
          <i id="micIcon" class="bi bi-mic"></i>
          <span id="voiceBtnText" class="small fw-semibold">Dictar</span>
        </button>
      </div>

      <!-- Buscador Predictivo Mercadona -->
      <div class="position-relative">
        <div class="input-group input-group-lg">
          <span class="input-group-text bg-white border-end-0 text-muted">
            <i class="bi bi-search"></i>
          </span>
          <input 
            type="text" 
            id="productInput" 
            class="form-control border-start-0 ps-0 fs-6 fw-semibold" 
            placeholder="Ej: Nesquik, leche, pollo, dentífrico, detergente..." 
            autocomplete="off"
          >
        </div>

        <!-- Desplegable de Sugerencias Oficiales -->
        <div id="suggestionsBox" class="d-none position-absolute w-100 bg-white border rounded-3 shadow-lg z-3 mt-1 overflow-y-auto" style="max-height: 290px;">
          <!-- Llenado dinámico con app.js -->
        </div>
      </div>

      <!-- Campo Opcional de Nota y Botón Añadir -->
      <div class="input-group mt-2">
        <input 
          type="text" 
          id="noteInput" 
          class="form-control form-control-sm bg-light" 
          placeholder="Nota opcional: 'pack de 6', 'traer 2 cajas'..."
        >
        <button id="addBtn" class="btn btn-success fw-bold px-3 d-flex align-items-center gap-1">
          <span>Añadir</span> <i class="bi bi-plus-lg"></i>
        </button>
      </div>
    </div>

    <!-- Filtros de Estado (Pendientes / Comprados) -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="btn-group btn-group-sm bg-white p-1 rounded-pill shadow-xs border" role="group">
        <button id="filterPending" onclick="setFilter('pending')" class="btn btn-sm btn-dark rounded-pill fw-bold px-3">
          Pendientes (<span id="pendingCount">0</span>)
        </button>
        <button id="filterBought" onclick="setFilter('bought')" class="btn btn-sm text-secondary rounded-pill fw-semibold px-3">
          Comprados (<span id="boughtCount">0</span>)
        </button>
        <button id="filterAll" onclick="setFilter('all')" class="btn btn-sm text-secondary rounded-pill fw-semibold px-3">
          Todos
        </button>
      </div>

      <button 
        id="clearBoughtBtn" 
        onclick="clearBoughtItems()" 
        class="btn btn-link btn-sm text-danger text-decoration-none fw-semibold p-0"
      >
        Limpiar comprados
      </button>
    </div>

    <!-- Lista de Productos Oficiales Mercadona -->
    <div id="itemsList" class="d-flex flex-column gap-2">
      <!-- Rellenado por app.js -->
    </div>

    <!-- Estado Vacío -->
    <div id="emptyState" class="d-none text-center py-5">
      <div class="fs-1 mb-2">🎉</div>
      <h3 class="h5 fw-bold text-dark">¡Todo comprado en Mercadona!</h3>
      <p class="small text-muted mb-0">Escribe arriba o pulsa en Dictar para apuntar lo que hace falta en casa.</p>
    </div>

  </main>

  <!-- MODAL FOTO GRANDE OFICIAL (Bootstrap Modal) -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content rounded-4 border-0 shadow-lg text-center p-2">
        <div class="modal-header border-0 pb-0">
          <div class="text-start">
            <h5 class="modal-title fw-bold fs-6" id="modalProductName">Producto</h5>
            <span id="modalProductPrice" class="badge bg-success-subtle text-success border border-success-subtle"></span>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-2">
          <div class="bg-white rounded-3 p-2 d-flex align-items-center justify-content-center border" style="min-height: 240px;">
            <img id="modalProductImg" src="" alt="Producto Oficial Mercadona" class="img-fluid rounded-2" style="max-height: 280px; object-fit: contain;">
          </div>
        </div>
        <div class="modal-footer border-0 pt-0 justify-content-between align-items-center">
          <small class="text-muted" style="font-size: 0.72rem;">Catálogo tienda.mercadona.es</small>
          <a id="modalMercadonaLink" href="https://tienda.mercadona.es/" target="_blank" class="btn btn-xs btn-outline-success rounded-pill fw-bold py-0 px-2" style="font-size: 0.7rem;">
            Ver en Mercadona ↗
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
